<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑金奢华 · 荣誉证书封面 视觉稿</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#f5f5f5;display:flex;justify-content:center;padding:24px 10px;
    font-family:"Georgia","STSong","Songti SC","Source Han Serif SC",serif;
  }
  .phone{width:100%;max-width:375px;background:#faf6ed;border-radius:8px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.12)}
  /* 封面 */
  .cover{
    text-align:center;
    padding:26px 20px 30px;
    background:linear-gradient(175deg,#2a1f14 0%,#1a1410 45%,#100c08 100%);
    color:#faf3e0;position:relative;
  }
  /* 鎏金饰带：顶部 */
  .band{
    display:flex;align-items:center;justify-content:center;gap:12px;
    margin-bottom:26px;
  }
  .band .line{width:64px;height:1px;background:linear-gradient(90deg,transparent,#c9a24a,transparent)}
  .band .dia{color:#d4af37;font-size:13px;letter-spacing:6px}
  /* kicker */
  .kicker{
    font-size:11px;letter-spacing:.38em;text-transform:uppercase;color:#e6c97a;
    margin-bottom:18px;
  }
  /* 标题 */
  .title{
    font-size:34px;font-weight:700;line-height:1.4;letter-spacing:.1em;color:#f6e7c0;
    text-align:center;margin-bottom:20px;
  }
  .title em{font-style:normal;color:#d4af37}
  /* 双金线 */
  .rulerWrap{margin:0 auto 20px;display:flex;align-items:center;justify-content:center;gap:10px;max-width:220px}
  .rulerWrap .r{height:1px;flex:1;background:linear-gradient(90deg,transparent,#d4af37,transparent)}
  .rulerWrap .glyph{color:#d4af37;font-size:11px}
  /* desc */
  .desc{font-size:13.5px;line-height:1.95;color:#e2d4ae;max-width:300px;margin:0 auto}
  /* 底部徽章 */
  .seal{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:10px}
  .seal .sq{width:8px;height:8px;background:#d4af37;transform:rotate(45deg)}
  .seal .star{color:#d4af37;font-size:14px;letter-spacing:3px}
</style>
</head>
<body>
<div class="phone">
  <section class="cover">
    <div class="band">
      <span class="line"></span>
      <span class="dia">◆</span>
      <span class="line"></span>
    </div>
    <div class="kicker">LUXURY COLLECTION</div>
    <div class="title">黑金时刻 · <em>臻藏</em></div>
    <div class="rulerWrap">
      <span class="r"></span>
      <span class="glyph">◆</span>
      <span class="r"></span>
    </div>
    <div class="desc">一份关于奢华与秩序的品牌手册<br>鎏金所至，皆是承诺</div>
    <div class="seal">
      <span class="sq"></span>
      <span class="star">✦</span>
      <span class="sq"></span>
    </div>
  </section>
  <div style="padding:24px 20px;color:#3d2818;font-size:15px;line-height:1.9">
    <p style="margin-bottom:12px">正文保持暖米纸底 + 深棕字，与深色封面形成对比。</p>
    <p>上方的深黑封面是视觉稿核心，重点体现：顶部鎏金饰带、证书式双金线、金色高亮标题、底部旋转金属菱形徽记。</p>
  </div>
</div>
</body>
</html>
